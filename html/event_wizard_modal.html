<!-- Event Creation Wizard Modal Partial Template -->
<div id="createEventWizardModal" class="modal-backdrop">
  <div class="modal-card">
    <div class="modal-header">
      <h3>Create Event (<span id="wizardDateTagTitle"></span>)</h3>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Participants (Select at least 2 subjects required)</label>
        <div class="subject-autocomplete-container" style="margin-bottom:10px;">
          <input type="text" id="wizardSubjectInput" class="input-text" placeholder="+ Search / add subject..." style="width:100%;">
          <div id="wizardSubjectAutocomplete" class="subject-autocomplete-dropdown"></div>
        </div>
        <div id="wizardParticipantsList"></div>
      </div>

      <div class="form-group">
        <label class="form-label">Action Tag (Select 1 of 12)</label>
        <div id="wizardActionButtonsGrid" class="action-buttons-grid"></div>
      </div>

      <div class="form-group">
        <label class="form-label">Event Notes</label>
        <input type="text" id="wizardNotesInput" class="input-text" placeholder="Description / notes..." style="width:100%;">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="cancelWizardBtn">Cancel</button>
      <button class="btn btn-primary" id="saveWizardBtn">Create Event</button>
    </div>
  </div>
</div>
