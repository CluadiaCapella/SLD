<!-- Fullscreen Lightbox Modal Partial Template -->
<div id="lightboxModal" class="lightbox-modal">
  <div class="lightbox-header">
    <div id="lightboxTitle" style="font-weight:700; color:#fff;"></div>
    <div style="display:flex; align-items:center; gap:12px;">
      <button class="btn btn-secondary btn-sm" id="lbDownloadOriginalBtn">📥 Download Original</button>
      <button class="btn btn-secondary btn-sm" id="lbEditThumbnailBtn">✂️ Edit Thumbnail</button>
      <span id="lightboxCounter" class="text-muted" style="font-size:0.85rem;"></span>
      <button class="btn btn-secondary btn-sm" id="closeLightboxBtn">✖ Close</button>
    </div>
  </div>

  <!-- Non-Destructive Editing Suite Toolbar -->
  <div class="lightbox-editor-toolbar" id="lightboxEditorToolbar">
    <button class="btn btn-secondary btn-sm" id="lbRotateBtn">🔄 Rotate</button>
    <button class="btn btn-secondary btn-sm" id="lbOpenCropModalBtn">✂️ Crop</button>
    <button class="btn btn-secondary btn-sm" id="lbAiToggleBtn">🤖 AI</button>
    <button class="btn btn-secondary btn-sm" id="lbSetAvatarBtn" style="display:none; color:var(--accent-pink); font-weight:700;">👤 Use as Avatar</button>
    <button class="btn btn-secondary btn-sm" id="lbResetCropBtn" style="display:none; color:#ef4444;">🔄 Clear Crop</button>
    <button class="btn btn-secondary btn-sm" id="lbToggleVideoClipperBtn" style="display:none;">✂️ Video Clipper (A-B)</button>
  </div>

  <!-- Video Clipper Panel -->
  <div class="video-clipper-panel" id="videoClipperPanel" style="display:none;">
    <div class="clipper-slider-group">
      <span class="clipper-handle-label"><strong>Start (A):</strong> <span id="clipStartVal">0.0s</span></span>
      <input type="range" id="clipStartSlider" min="0" max="100" value="0" step="0.1" style="flex:1;">
    </div>
    <div class="clipper-slider-group">
      <span class="clipper-handle-label"><strong>End (B):</strong> <span id="clipEndVal">10.0s</span></span>
      <input type="range" id="clipEndSlider" min="0" max="100" value="10" step="0.1" style="flex:1;">
    </div>
  </div>

  <div class="lightbox-content-wrapper" id="lightboxContentWrapper">
    <button class="lightbox-nav-btn prev" id="lbPrevBtn">‹</button>
    <div class="lightbox-media-container" id="lightboxMediaContainer"></div>
    <button class="lightbox-nav-btn next" id="lbNextBtn">›</button>

    <!-- Floating Heart Overlay for Fullscreen Mode -->
    <div class="floating-heart-overlay" id="floatingHeartOverlay" style="display:none;">
      <button class="heart-toggle-btn btn-sm" id="flPinkBtn">🩷</button>
      <button class="heart-toggle-btn btn-sm" id="flGreyBtn">🩶</button>
      <button class="heart-toggle-btn btn-sm" id="flBlueBtn">🩵</button>
    </div>
  </div>

  <!-- Categorized Lightbox Footer -->
  <div class="lightbox-footer">
    <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap:16px;">
      <!-- Subjects Section -->
      <div>
        <div style="font-weight:700; font-size:0.85rem; margin-bottom:6px;">👥 Subjects</div>
        <div class="subject-autocomplete-container" style="margin-bottom:8px;">
          <input type="text" id="lbSubjectInput" class="input-text btn-sm" placeholder="+ Add / create subject..." style="width:100%;">
          <div id="lbSubjectAutocomplete" class="subject-autocomplete-dropdown"></div>
        </div>
        <div id="lbSubjectsContainer"></div>
      </div>

      <!-- SLDs Section -->
      <div>
        <div style="font-weight:700; font-size:0.85rem; margin-bottom:6px;">📘 SLDs</div>
        <div class="date-autocomplete-container" style="margin-bottom:8px;">
          <input type="text" id="lbSldInput" class="input-text btn-sm" placeholder="+ Add SLD Date (e.g. 630)..." style="width:100%;">
          <div id="lbSldAutocomplete" class="date-autocomplete-dropdown"></div>
        </div>
        <div id="lbBlueEventsList"></div>
      </div>

      <!-- Events Section -->
      <div>
        <div style="font-weight:700; font-size:0.85rem; margin-bottom:6px;">📙 Events</div>
        <select id="lbEventSelect" class="select-input btn-sm" style="width:100%; margin-bottom:8px;">
          <option value="">+ Assign Existing Event...</option>
        </select>
        <div id="lbEventsContainer"></div>
      </div>

      <!-- Standard Tags Section -->
      <div>
        <div style="font-weight:700; font-size:0.85rem; margin-bottom:6px;">🏷️ Tags</div>
        <div class="tag-autocomplete-container" style="margin-bottom:8px;">
          <input type="text" id="lbNormalTagInput" class="input-text btn-sm" placeholder="+ Add tag (Enter)..." style="width:100%;">
          <div id="lbNormalTagAutocomplete" class="tag-autocomplete-dropdown"></div>
        </div>
        <div id="lbNormalTagsContainer"></div>
      </div>

      <!-- Star Rating Override Section -->
      <div>
        <div style="font-weight:700; font-size:0.85rem; margin-bottom:6px;">⭐ Star Rating & Overrides</div>
        <div id="lbRatingControls" style="display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-bottom:8px;">
          <button class="btn btn-secondary btn-sm rating-override-btn" data-rating="-1" title="Mark as Rejected">🚫 Rejected</button>
          <button class="btn btn-secondary btn-sm rating-override-btn" data-rating="1" title="1 Star">⭐ 1</button>
          <button class="btn btn-secondary btn-sm rating-override-btn" data-rating="2" title="2 Stars">⭐ 2</button>
          <button class="btn btn-secondary btn-sm rating-override-btn" data-rating="3" title="3 Stars">⭐ 3</button>
          <button class="btn btn-secondary btn-sm rating-override-btn" data-rating="4" title="4 Stars">⭐ 4</button>
          <button class="btn btn-secondary btn-sm rating-override-btn" data-rating="5" title="5 Stars">⭐ 5</button>
          <button class="btn btn-secondary btn-sm rating-override-btn" data-rating="auto" title="Reset to Auto Calculation">🔄 Auto</button>
        </div>
        <div id="lbRatingBadgeInfo" style="font-size:0.8rem; font-weight:700; color:var(--text-secondary);"></div>
      </div>
    </div>
  </div>
</div>
